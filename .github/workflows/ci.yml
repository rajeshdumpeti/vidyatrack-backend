name: Backend CI/CD

on:
  pull_request:
    branches: ["dev", "stage", "main"]
  push:
    branches: ["dev", "stage", "main"]

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Import sanity check
        run: |
          APP_ENV=test JWT_SECRET=test-secret OTP_PEPPER=test-pepper python -c "import fastapi; import app.main; print('backend imports ok')"

      - name: Basic syntax check (compileall)
        run: |
          python -m compileall -q .

      - name: Run test suite
        env:
          APP_ENV: test
          JWT_SECRET: test-secret
          OTP_PEPPER: test-pepper
          OTP_DELIVERY_MODE: provider
          OTP_DEBUG_LOG_PLAINTEXT: "false"
        run: |
          pytest -q

  migrate_and_deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'stage' && 'staging' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select target environment
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)
              echo "APP_ENV=dev" >> "$GITHUB_ENV"
              ;;
            stage)
              echo "APP_ENV=stage" >> "$GITHUB_ENV"
              ;;
            main)
              echo "APP_ENV=prod" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}" >&2
              exit 1
              ;;
          esac

      - name: Run Alembic migrations
        env:
          APP_ENV: ${{ env.APP_ENV }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
        run: |
          alembic upgrade head

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
