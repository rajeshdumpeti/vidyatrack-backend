services:
  # Development service tracks the `dev` branch and uses the Neon dev database.
  - type: web
    name: vidyatrack-backend-dev
    runtime: python
    plan: free
    branch: dev
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_NAME
        value: vidyatrack-backend
      - key: APP_ENV
        value: dev
      - key: DEBUG
        value: "true"
      - key: DATABASE_URL_DEV
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: OTP_DELIVERY_MODE
        value: local_log_only
      - key: OTP_DEBUG_LOG_PLAINTEXT
        value: "true"
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "15"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "900"
      - key: CORS_ALLOW_ORIGINS
        value: https://vidyatrack-dev.vercel.app

  # Staging mirrors production config shape but keeps a separate Neon database.
  - type: web
    name: vidyatrack-backend-stage
    runtime: python
    plan: free
    branch: stage
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_NAME
        value: vidyatrack-backend
      - key: APP_ENV
        value: stage
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL_STAGE
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: OTP_DELIVERY_MODE
        value: provider
      - key: OTP_DEBUG_LOG_PLAINTEXT
        value: "false"
      - key: DB_POOL_SIZE
        value: "4"
      - key: DB_MAX_OVERFLOW
        value: "4"
      - key: DB_POOL_TIMEOUT
        value: "20"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1200"
      - key: CORS_ALLOW_ORIGINS
        sync: false

  # Production points to the Render PostgreSQL database and should run on a paid plan.
  - type: web
    name: vidyatrack-backend-prod
    runtime: python
    plan: starter
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_NAME
        value: vidyatrack-backend
      - key: APP_ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL_PROD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: OTP_DELIVERY_MODE
        value: provider
      - key: OTP_DEBUG_LOG_PLAINTEXT
        value: "false"
      - key: DB_POOL_SIZE
        value: "8"
      - key: DB_MAX_OVERFLOW
        value: "8"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1500"
      - key: CORS_ALLOW_ORIGINS
        sync: false
